name: Notifications Cron Workflow

on:
  workflow_dispatch:
  schedule:
    # Runs every 10 minutes
    - cron: '*/10 * * * *'

jobs:
  ping-notifications:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Notifications Endpoint
        env:
          CRON_SECRET: ${{ secrets.NOTIFICATIONS_CRON_SECRET }}
          API_URL: ${{ secrets.ORESCORE_API_URL }}
        run: |
          curl -X POST "$API_URL/api/cron/notifications" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json"
